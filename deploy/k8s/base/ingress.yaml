apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trustfl-api
  namespace: trustfl
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # Raised to 128 MiB to accommodate real YOLOv8n weight payloads on /submit.
    # Matches COORDINATOR_MAX_BODY_BYTES=134217728 in the coordinator service.
    nginx.ingress.kubernetes.io/proxy-body-size: "128m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains";
      more_set_headers "Content-Security-Policy: default-src 'none'; frame-ancestors 'none'";
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.trustfl.example.com  # override in production overlay
      secretName: trustfl-api-tls
  rules:
    - host: api.trustfl.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: trustfl-api
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trustfl-dashboard
  namespace: trustfl
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: SAMEORIGIN";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains";
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - dashboard.trustfl.example.com
      secretName: trustfl-dashboard-tls
  rules:
    - host: dashboard.trustfl.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: trustfl-dashboard
                port:
                  name: http
