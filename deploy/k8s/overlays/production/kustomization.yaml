apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

bases:
  - ../../base

namespace: trustfl

# Production overrides
patches:
  - target:
      kind: ConfigMap
      name: trustfl-config
    patch: |-
      - op: replace
        path: /data/blockchain-rpc-url
        value: "${BLOCKCHAIN_RPC_URL}"
      - op: replace
        path: /data/cors-allowed-origins
        value: "${CORS_ALLOWED_ORIGINS}"
      - op: replace
        path: /data/ipfs-url
        value: "${IPFS_URL}"
  - target:
      kind: Ingress
      name: trustfl-api
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: "${API_HOST}"
      - op: replace
        path: /spec/tls/0/hosts/0
        value: "${API_HOST}"
  - target:
      kind: Ingress
      name: trustfl-dashboard
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: "${DASHBOARD_HOST}"
      - op: replace
        path: /spec/tls/0/hosts/0
        value: "${DASHBOARD_HOST}"

# Pin images to immutable digests for production
# Replace the sha256 digests with real values from your release pipeline.
# Example: ghcr.io/fl-blockchain-project-major/trustfl/api@sha256:<digest>
images:
  - name: ghcr.io/fl-blockchain-project-major/trustfl/api
    newTag: "${TRUSTFL_VERSION}"
  - name: ghcr.io/fl-blockchain-project-major/trustfl/coordinator
    newTag: "${TRUSTFL_VERSION}"
  - name: ghcr.io/fl-blockchain-project-major/trustfl/client
    newTag: "${TRUSTFL_VERSION}"
  - name: ghcr.io/fl-blockchain-project-major/trustfl/dashboard
    newTag: "${TRUSTFL_VERSION}"
