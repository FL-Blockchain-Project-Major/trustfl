apiVersion: v1
kind: Service
metadata:
  name: {{ include "trustfl.fullname" . }}-dashboard
  labels:
    {{- include "trustfl.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  type: {{ .Values.dashboard.service.type }}
  ports:
    - name: http
      port: {{ .Values.dashboard.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "trustfl.selectorLabels" (dict "root" . "component" "dashboard") | nindent 4 }}
