{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "trustfl.fullname" . }}-deny-all-default
  labels:
    {{- include "trustfl.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    # Allow DNS from all pods
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "trustfl.fullname" . }}-api
  labels:
    {{- include "trustfl.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "trustfl.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: {{ .Values.api.service.port }}
  egress:
    - to: []
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 5432
        - port: 6379
        - port: 5001
        - port: 443
        - port: 8545
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "trustfl.fullname" . }}-coordinator
  labels:
    {{- include "trustfl.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "trustfl.selectorLabels" (dict "root" . "component" "coordinator") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: {{ .Values.coordinator.service.port }}
  egress:
    - to: []
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 5432
        - port: 5001
        - port: 443
        - port: 8545
{{- end }}
