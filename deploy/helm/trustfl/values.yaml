# TrustFL Helm Chart production values
# IMPORTANT:
# 1. Image digests MUST be pinned immutable sha256 digests in production.
#    Mutable tags like 'latest' or bare branch names are rejected.
# 2. Production credentials MUST be managed through External Secrets Operator
#    or Kubernetes Secret references (existingSecret). Never pass credentials
#    via Helm --set, unencrypted values files, or command-line arguments.

# -- Global image settings
global:
  imageRegistry: "ghcr.io/fl-blockchain-project-major/trustfl"
  # Production REQUIRES an immutable sha256 digest (e.g. sha256:1234567890abcdef...).
  # Mutable tags like 'latest' are strictly rejected by templates and validation gates.
  imageDigest: ""
  imagePullPolicy: IfNotPresent

# -- API service
api:
  replicaCount: 2
  image:
    name: api
    digest: ""  # defaults to global.imageDigest if not set
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "2000m"
      memory: "1Gi"
  env:
    ENVIRONMENT: production
    API_AUTH_REQUIRED: "true"
    API_LEGACY_AUTH_COMPAT: "false"
    CLIENT_ENROLLMENT_AUTO_APPROVE: "false"
    CLIENT_KEY_STORE: secret_manager
  # Secret references (Kubernetes Secrets provisioned by External Secrets Operator / Vault)
  existingSecret: "trustfl-api-keys"
  databaseSecret: "trustfl-db"
  redisSecret: "trustfl-redis"
  ingress:
    enabled: true
    className: nginx
    host: api.trustfl.example.com
    tlsSecretName: trustfl-api-tls
  service:
    type: ClusterIP
    port: 8000

# -- Coordinator service
coordinator:
  replicaCount: 1  # MUST be 1; coordinator uses a DB fencing lease
  image:
    name: coordinator
    digest: ""  # defaults to global.imageDigest if not set
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "2Gi"
  env:
    ENVIRONMENT: production
    COORDINATOR_REQUIRE_SIGNATURES: "true"
    COORDINATOR_REQUIRE_ZKP: "true"
    COORDINATOR_INSECURE_DEV_AUTH: "false"
    STORAGE_BACKEND: ipfs
    BLOCKCHAIN_ENABLED: "true"
  existingSecret: "trustfl-coordinator-keys"
  databaseSecret: "trustfl-db"
  service:
    type: ClusterIP
    port: 8100

# -- Dashboard
dashboard:
  replicaCount: 2
  image:
    name: dashboard
    digest: ""  # defaults to global.imageDigest if not set
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  env:
    HOSTNAME: "0.0.0.0"
  existingSecret: "trustfl-dashboard-keys"
  ingress:
    enabled: true
    className: nginx
    host: dashboard.trustfl.example.com
    tlsSecretName: trustfl-dashboard-tls
  service:
    type: ClusterIP
    port: 3000

# -- Shared configuration (non-secret)
config:
  federationId: "fed-default"
  flMinClients: "3"
  flNumClients: "3"
  flNumRounds: "3"
  blockchainRpcUrl: "https://rpc.trustfl.example.com"
  ipfsUrl: "http://ipfs:5001"
  corsAllowedOrigins: "https://dashboard.trustfl.example.com"

# -- Network policies
networkPolicy:
  enabled: true

# -- Pod disruption budgets
podDisruptionBudget:
  api:
    enabled: true
    minAvailable: 1
  coordinator:
    enabled: false  # coordinator is single-instance; PDB would block upgrades
  dashboard:
    enabled: true
    minAvailable: 1

# -- HPA (disabled by default; coordinator cannot scale horizontally)
autoscaling:
  api:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
