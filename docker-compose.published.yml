# TrustFL – Published-image Compose Stack
#
# Uses pre-built images from GHCR for the Python application services
# (api, coordinator, client, dashboard).  The blockchain infrastructure
# (hardhat, contract-deployer) still requires local source files from
# ./packages/contracts because smart contracts must be compiled and deployed
# to a fresh Hardhat network each run.
#
# ── Quickstart ────────────────────────────────────────────────────────────────
#   export TRUSTFL_VERSION=0.1.0    # pinned release tag
#   cp .env.example .env            # edit production secrets and endpoints
#   docker compose -f docker-compose.published.yml pull
#   docker compose -f docker-compose.published.yml up
#
# ── Prerequisites on the host ─────────────────────────────────────────────────
#   - A deployed contract manifest at BLOCKCHAIN_CONTRACTS_DIR/contracts.json
#   - A directory set as FL_DATASET_DIR (raw VisDrone images + annotations)
#
# ── What is NOT required ──────────────────────────────────────────────────────
#   - Python, Node.js, pip, npm, or any build toolchain
#   - The apps/ source tree
#   - A local Hardhat development chain; configure a real EVM RPC endpoint.
#
# Images are published automatically on tagged releases via
# .github/workflows/publish.yml.
#
# ── Image namespace ───────────────────────────────────────────────────────────
#   ghcr.io/sayam-1705/trustfl/{api,coordinator,client,dashboard}:<version>
#   Use TRUSTFL_VERSION=latest only for development; pin a semver tag in
#   production so deployments are reproducible.

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trustfl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-trustfl}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-trustfl} -d $${POSTGRES_DB:-trustfl}"]
      interval: 5s
      timeout: 5s
      retries: 5

  ipfs:
    image: ipfs/kubo:v0.32.1
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ipfs_data:/data/ipfs
    healthcheck:
      test: ["CMD", "wget", "--post-data=", "-qO-", "http://localhost:5001/api/v0/id"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/sayam-1705/trustfl/api:${TRUSTFL_VERSION:?TRUSTFL_VERSION must be set to a pinned release}
    environment:
      - ENVIRONMENT=production
      - API_PORT=${API_PORT:-8000}
      - API_AUTH_REQUIRED=true
      - API_READ_KEY=${API_READ_KEY:?API_READ_KEY must be set}
      - API_WRITE_KEY=${API_WRITE_KEY:?API_WRITE_KEY must be set}
      - API_ADMIN_KEY=${API_ADMIN_KEY:?API_ADMIN_KEY must be set}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-trustfl}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-trustfl}
      - IPFS_URL=http://ipfs:5001
      - WEB3_PROVIDER_URI=${BLOCKCHAIN_RPC_URL:?BLOCKCHAIN_RPC_URL must be set}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must be set}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      ipfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 10s
      timeout: 5s
      retries: 5

  client-init:
    image: ghcr.io/sayam-1705/trustfl/client:${TRUSTFL_VERSION:?TRUSTFL_VERSION must be set to a pinned release}
    command: >
      python -m trustfl_crypto.provision
        --keys-dir /var/lib/trustfl/keys
        --num-clients ${FL_NUM_CLIENTS:-2}
        --min-clients ${FL_MIN_CLIENTS:-2}
    environment:
      - FL_NUM_CLIENTS=${FL_NUM_CLIENTS:-2}
      - FL_MIN_CLIENTS=${FL_MIN_CLIENTS:-2}
      - FL_KEYS_DIR=/var/lib/trustfl/keys
    volumes:
      - client_keys:/var/lib/trustfl/keys
    restart: "no"

  coordinator:
    image: ghcr.io/sayam-1705/trustfl/coordinator:${TRUSTFL_VERSION:?TRUSTFL_VERSION must be set to a pinned release}
    environment:
      - FL_FEDERATION_ID=${FL_FEDERATION_ID:-fed-default}
      - COORDINATOR_REQUIRE_SIGNATURES=true
      - COORDINATOR_ENROLLMENT_TOKEN=${COORDINATOR_ENROLLMENT_TOKEN:?COORDINATOR_ENROLLMENT_TOKEN must be set}
      - COORDINATOR_ENROLLMENT_ALLOWLIST_FILE=/var/lib/trustfl/keys/allowlist.json
      - COORDINATOR_INSECURE_DEV_AUTH=${COORDINATOR_INSECURE_DEV_AUTH:-false}
      - FL_MIN_CLIENTS=${FL_MIN_CLIENTS:-2}
      - FL_NUM_CLIENTS=${FL_NUM_CLIENTS:-2}
      - FL_NUM_ROUNDS=${FL_NUM_ROUNDS:-3}
      - FL_MAX_UPDATE_NORM=${FL_MAX_UPDATE_NORM:-1.0}
      - COORDINATOR_PORT=8100
      - DATABASE_URL=postgresql://${POSTGRES_USER:-trustfl}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-trustfl}
      - IPFS_URL=http://ipfs:5001
      - IPFS_API_URL=http://ipfs:5001
      - STORAGE_BACKEND=ipfs
      - BLOCKCHAIN_ENABLED=true
      - BLOCKCHAIN_RPC_URL=${BLOCKCHAIN_RPC_URL:?BLOCKCHAIN_RPC_URL must be set}
      - BLOCKCHAIN_CONTRACTS_JSON=/contracts-deployments/contracts.json
      - COORDINATOR_PRIVATE_KEY=${COORDINATOR_PRIVATE_KEY:?COORDINATOR_PRIVATE_KEY must be set}
    volumes:
      - ${BLOCKCHAIN_CONTRACTS_DIR:?BLOCKCHAIN_CONTRACTS_DIR must point to a directory containing contracts.json}:/contracts-deployments:ro
      - client_keys:/var/lib/trustfl/keys:ro
    ports:
      - "127.0.0.1:${COORDINATOR_HOST_PORT:-8100}:8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
      ipfs:
        condition: service_healthy
      client-init:
        condition: service_completed_successfully

  client:
    image: ghcr.io/sayam-1705/trustfl/client:${TRUSTFL_VERSION:?TRUSTFL_VERSION must be set to a pinned release}
    environment:
      - FL_CLIENT_ID=auto
      - FL_NUM_CLIENTS=${FL_NUM_CLIENTS:-2}
      - FL_KEYS_DIR=/var/lib/trustfl/keys
      - FL_FEDERATION_ID=${FL_FEDERATION_ID:-fed-default}
      - FL_COORDINATOR_URL=http://coordinator:8100
      - COORDINATOR_ENROLLMENT_TOKEN=${COORDINATOR_ENROLLMENT_TOKEN:?COORDINATOR_ENROLLMENT_TOKEN must be set}
      - FL_DATASET_DIR=/data/dataset
      - FL_LOCAL_EPOCHS=${FL_LOCAL_EPOCHS:-1}
      - FL_MAX_SAMPLES=${FL_MAX_SAMPLES:-50}
      - FL_POLL_INTERVAL_SECONDS=${FL_POLL_INTERVAL_SECONDS:-3.0}
    volumes:
      - client_keys:/var/lib/trustfl/keys
      - ${FL_DATASET_DIR:?FL_DATASET_DIR must point to the client dataset}:/data/dataset:ro
    depends_on:
      coordinator:
        condition: service_healthy
      client-init:
        condition: service_completed_successfully
    deploy:
      replicas: ${FL_NUM_CLIENTS:-2}

  dashboard:
    image: ghcr.io/sayam-1705/trustfl/dashboard:${TRUSTFL_VERSION:?TRUSTFL_VERSION must be set to a pinned release}
    environment:
      - HOSTNAME=0.0.0.0
      - INTERNAL_API_URL=http://api:8000
      - API_READ_KEY=${API_READ_KEY:?API_READ_KEY must be set}
      - DASHBOARD_ACCESS_KEY=${DASHBOARD_ACCESS_KEY:?DASHBOARD_ACCESS_KEY must be set}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db_data:
  ipfs_data:
  client_keys:
