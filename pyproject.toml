[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trustfl"
version = "0.1.0"
description = "TrustFL: Production-oriented Federated Learning with Blockchain Auditability, Cryptographic Verification, and ZK Proofs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "TrustFL Team", email = "dev@trustfl.org" }
]
dependencies = [
    "pydantic>=2.7.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "web3>=6.19.0",
    "cryptography>=42.0.7",
    "httpx>=0.27.0",
    "psycopg[binary]>=3.1.0",
    "SQLAlchemy>=2.0.0",
    "alembic>=1.13.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.4",
    "mypy>=1.10.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
pythonpath = [
    "packages/schemas",
    "packages/crypto",
    "packages/storage",
    "packages/fl_core",
    "packages/ml_core",
    "packages/blockchain",
    "packages/core",
    "packages/zkp",
]
testpaths = [
    "tests",
]
python_files = ["test_*.py", "*_test.py"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["packages", "apps"]
