[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trustfl"
version = "0.1.0"
description = "TrustFL: Production-oriented Federated Learning with Blockchain Auditability, Cryptographic Verification, and ZK Proofs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "TrustFL Team", email = "dev@trustfl.org" }
]
dependencies = [
    "pydantic==2.13.5",
    "fastapi==0.142.4",
    "uvicorn==0.54.0",
    "web3==8.0.0",
    "cryptography==50.0.2",
    "httpx==0.28.1",
    "Pillow==13.0.0",
    "psycopg[binary]==3.3.6",
    "SQLAlchemy==2.0.43",
    "alembic==1.16.5",
    "slowapi==0.1.9",
    "redis==6.4.0",
    "numpy==2.4.6",
    "pyyaml==6.0.4",
    "torch==2.15.0",
    "torchvision==0.29.2",
    "ultralytics==8.4.219",
    "opencv-python==5.1.0.95",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.10",
    "mypy==2.4.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
pythonpath = [
    ".",
    "packages/schemas",
    "packages/crypto",
    "packages/storage",
    "packages/fl_core",
    "packages/ml_core",
    "packages/blockchain",
    "packages/core",
    "packages/zkp",
    "packages/observability",
]
testpaths = [
    "tests",
]
python_files = ["test_*.py", "*_test.py"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["packages", "apps"]
