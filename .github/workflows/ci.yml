name: TrustFL CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check .

      - name: Run Python tests
        run: pytest tests/

  frontend-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/dashboard

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: "npm"
          cache-dependency-path: "apps/dashboard/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests
        run: npm test

      - name: Build dashboard
        run: npm run build

  contract-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: packages/contracts

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: "npm"
          cache-dependency-path: "packages/contracts/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npx hardhat compile

      - name: Test contracts
        run: npx hardhat test

  zk-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: packages/zkp

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"

      - name: Install ZKP dependencies
        run: npm ci

      - name: Run ZKP tests
        run: npm test

  docker-build:
    needs:
      - python-tests
      - frontend-tests
      - contract-tests
      - zk-tests

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t trustfl-api -f apps/api/Dockerfile .

      - name: Build coordinator image
        run: docker build -t trustfl-coordinator -f apps/coordinator/Dockerfile .

      - name: Build client image
        run: docker build -t trustfl-client -f apps/client/Dockerfile .

      - name: Build dashboard image
        run: |
          cd apps/dashboard
          docker build -t trustfl-dashboard -f Dockerfile .

      - name: Validate Compose configuration
        run: docker compose config

  compose-e2e:
    needs: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Run full TrustFL Compose E2E
        shell: bash
        run: |
          set -Eeuo pipefail

          export COMPOSE_PROJECT_NAME="trustfl-ci-${GITHUB_RUN_ID}"
          export COORDINATOR_HOST_PORT=18100

          cleanup() {
            local status=$?

            echo "=================================================="
            echo "TrustFL E2E cleanup"
            echo "=================================================="

            if [[ "$status" -ne 0 ]]; then
              echo "=== Compose status ==="
              docker compose ps --all || true

              echo "=== Compose logs ==="
              docker compose logs --no-color --tail=500 || true
            fi

            echo "=== Stopping Compose stack ==="
            docker compose down --volumes --remove-orphans || true

            exit "$status"
          }

          trap cleanup EXIT

          echo "=================================================="
          echo "Starting TrustFL Compose stack"
          echo "=================================================="

          docker compose up --build -d

          wait_for_url() {
            local url="$1"
            local timeout_seconds="${2:-180}"
            local deadline=$((SECONDS + timeout_seconds))

            while (( SECONDS < deadline )); do
              if curl \
                --fail \
                --silent \
                --show-error \
                --location \
                --connect-timeout 2 \
                --max-time 10 \
                --retry 3 \
                --retry-all-errors \
                --retry-delay 1 \
                "$url" >/dev/null 2>&1; then
                echo "Ready: $url"
                return 0
              fi

              sleep 3
            done

            echo "Timed out waiting for: $url"
            return 1
          }

          wait_for_coordinator() {
            local timeout_seconds="${1:-180}"
            local deadline=$((SECONDS + timeout_seconds))

            while (( SECONDS < deadline )); do
              local container_id
              local state

              container_id="$(
                docker compose ps -q coordinator 2>/dev/null || true
              )"

              if [[ -n "$container_id" ]]; then
                state="$(
                  docker inspect \
                    --format '{{.State.Status}} {{.State.ExitCode}}' \
                    "$container_id" \
                    2>/dev/null || true
                )"

                if curl \
                  --fail \
                  --silent \
                  --show-error \
                  --location \
                  --connect-timeout 2 \
                  --max-time 10 \
                  --retry 3 \
                  --retry-all-errors \
                  --retry-delay 1 \
                  "http://localhost:${COORDINATOR_HOST_PORT}/health" \
                  >/dev/null 2>&1; then
                  echo "Coordinator is ready."
                  return 0
                fi

                if [[ "$state" == "exited 0" ]]; then
                  echo "Coordinator completed with exit code 0."
                  return 0
                fi

                if [[ "$state" == exited* ]] && [[ "$state" != "exited 0" ]]; then
                  echo "Coordinator exited unexpectedly: $state"
                  return 1
                fi
              fi

              sleep 3
            done

            echo "Timed out waiting for coordinator."
            return 1
          }

          echo "=================================================="
          echo "Waiting for infrastructure"
          echo "=================================================="

          wait_for_url "http://localhost:8000/health/" 180
          wait_for_url "http://localhost:3000/" 180
          wait_for_coordinator 180

          echo "Checking PostgreSQL..."

          docker compose exec -T db \
            pg_isready \
            -U "${POSTGRES_USER:-trustfl}" \
            -d "${POSTGRES_DB:-trustfl}"

          echo "Checking IPFS..."

          docker compose exec -T ipfs \
            wget \
            -qO- \
            --post-data= \
            http://localhost:5001/api/v0/id \
            >/dev/null

          echo "Checking Hardhat..."

          docker compose exec -T hardhat \
            node -e "
              fetch('http://localhost:8545', {
                method: 'POST',
                headers: {'content-type': 'application/json'},
                body: JSON.stringify({
                  jsonrpc: '2.0',
                  id: 1,
                  method: 'net_version',
                  params: []
                })
              })
              .then(response => {
                if (!response.ok) process.exit(1);
              })
              .catch(() => process.exit(1));
            "

          echo "=================================================="
          echo "Infrastructure is ready"
          echo "=================================================="

          docker compose ps --all

          fetch_json() {
            local url="$1"

            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --connect-timeout 2 \
              --max-time 10 \
              --retry 5 \
              --retry-all-errors \
              --retry-delay 1 \
              "$url"
          }

          echo "=================================================="
          echo "Waiting for signed FL lifecycle"
          echo "=================================================="

          lifecycle_timeout_seconds=600
          lifecycle_deadline=$((SECONDS + lifecycle_timeout_seconds))
          lifecycle_passed=false
          attempt=0

          while (( SECONDS < lifecycle_deadline )); do
            attempt=$((attempt + 1))

            echo "Checking FL lifecycle... attempt=${attempt}"

            rounds="$(
              fetch_json \
                "http://localhost:8000/rounds/federation/fed-default"
            )" || {
              echo "Unable to fetch rounds; retrying..."
              sleep 3
              continue
            }

            updates="$(
              fetch_json \
                "http://localhost:8000/updates/federation/fed-default"
            )" || {
              echo "Unable to fetch updates; retrying..."
              sleep 3
              continue
            }

            transactions="$(
              fetch_json \
                "http://localhost:8000/blockchain/transactions?limit=100"
            )" || {
              echo "Unable to fetch blockchain transactions; retrying..."
              sleep 3
              continue
            }

            if python - "$rounds" "$updates" "$transactions" <<'PY'
          import json
          import sys

          rounds, updates, transactions = map(json.loads, sys.argv[1:])

          round_data = rounds.get("data", [])
          update_data = updates.get("data", [])
          transaction_data = transactions.get("data", [])

          finalized_rounds = {
              int(item["round_number"])
              for item in round_data
              if item.get("status") == "FINALIZED"
          }

          expected_rounds = {1, 2, 3}

          assert expected_rounds.issubset(finalized_rounds), (
              f"Expected finalized rounds {expected_rounds}, "
              f"got {finalized_rounds}"
          )

          expected_clients = {"client_001", "client_002"}

          verified_clients = {
              item["client_id"]
              for item in update_data
              if item.get("status") in {"VERIFIED", "AGGREGATED"}
              and item.get("client_id") in expected_clients
          }

          assert expected_clients.issubset(verified_clients), (
              f"Expected verified/aggregated clients {expected_clients}, "
              f"got {verified_clients}"
          )

          confirmed_transactions = [
              item
              for item in transaction_data
              if item.get("status") == "CONFIRMED"
          ]

          assert confirmed_transactions, (
              "No CONFIRMED blockchain transaction found"
          )

          print(
              f"Finalized rounds: {sorted(finalized_rounds)}"
          )
          print(
              f"Verified/aggregated clients: "
              f"{sorted(verified_clients)}"
          )
          print(
              "Confirmed blockchain transactions: "
              f"{len(confirmed_transactions)}"
          )
          PY
            then
              lifecycle_passed=true
              echo "Signed FL lifecycle completed successfully."
              break
            fi

            if (( attempt % 10 == 0 )); then
              echo "=================================================="
              echo "FL lifecycle diagnostic at attempt ${attempt}"
              echo "=================================================="

              echo "=== Compose status ==="
              docker compose ps --all || true

              echo "--- Coordinator logs ---"
              docker compose logs \
                --no-color \
                --tail=100 \
                coordinator || true

              echo "--- Client logs ---"
              docker compose logs \
                --no-color \
                --tail=100 \
                client-1 \
                client-2 || true

              echo "--- API logs ---"
              docker compose logs \
                --no-color \
                --tail=100 \
                api || true
            fi

            sleep 5
          done

          if [[ "$lifecycle_passed" != true ]]; then
            echo "=================================================="
            echo "FL lifecycle timed out"
            echo "=================================================="

            docker compose ps --all

            docker compose logs \
              --no-color \
              --tail=500 \
              coordinator \
              client-1 \
              client-2 \
              api

            exit 1
          fi

          echo "=================================================="
          echo "Verifying dashboard visibility"
          echo "=================================================="

          dashboard="$(
            fetch_json \
              "http://localhost:3000/api/dashboard/federations/"
          )"

          python - "$dashboard" <<'PY'
          import json
          import sys

          payload = json.loads(sys.argv[1])

          assert payload.get("success") is True, (
              f"Dashboard API unsuccessful: {payload!r}"
          )

          data = payload.get("data")

          assert isinstance(data, list), (
              f"Dashboard federation data is not a list: {data!r}"
          )

          assert any(
              item.get("id") == "fed-default"
              for item in data
              if isinstance(item, dict)
          ), (
              "fed-default federation not visible in dashboard data: "
              f"{data!r}"
          )

          print("Dashboard federation visibility verified.")
          PY

          echo "=================================================="
          echo "Verifying final lifecycle state"
          echo "=================================================="

          final_rounds="$(
            fetch_json \
              "http://localhost:8000/rounds/federation/fed-default"
          )"

          final_updates="$(
            fetch_json \
              "http://localhost:8000/updates/federation/fed-default"
          )"

          final_transactions="$(
            fetch_json \
              "http://localhost:8000/blockchain/transactions?limit=100"
          )"

          python \
            "$final_rounds" \
            "$final_updates" \
            "$final_transactions" <<'PY'
          import json
          import sys

          rounds, updates, transactions = map(json.loads, sys.argv[1:])

          finalized_rounds = {
              int(item["round_number"])
              for item in rounds.get("data", [])
              if item.get("status") == "FINALIZED"
          }

          expected_rounds = {1, 2, 3}

          assert expected_rounds.issubset(finalized_rounds), (
              "Final state missing rounds: "
              f"{expected_rounds - finalized_rounds}"
          )

          valid_updates = [
              item
              for item in updates.get("data", [])
              if item.get("status") in {"VERIFIED", "AGGREGATED"}
          ]

          expected_clients = {"client_001", "client_002"}

          valid_clients = {
              item.get("client_id")
              for item in valid_updates
              if item.get("client_id")
          }

          assert expected_clients.issubset(valid_clients), (
              f"Expected client updates from {expected_clients}, "
              f"got {valid_clients}"
          )

          confirmed_transactions = [
              item
              for item in transactions.get("data", [])
              if item.get("status") == "CONFIRMED"
          ]

          assert confirmed_transactions, (
              "No confirmed blockchain transaction found"
          )

          print(
              f"Finalized rounds: {sorted(finalized_rounds)}"
          )
          print(
              f"Verified/aggregated updates: {len(valid_updates)}"
          )
          print(
              f"Participating clients: {sorted(valid_clients)}"
          )
          print(
              "Confirmed blockchain transactions: "
              f"{len(confirmed_transactions)}"
          )
          PY

          echo "=================================================="
          echo "TrustFL Compose E2E PASSED"
          echo "=================================================="