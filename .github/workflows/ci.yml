name: TrustFL CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: packages/zkp/package-lock.json

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install --no-deps -e .

      - name: Install ZKP runtime dependencies
        working-directory: packages/zkp
        run: npm ci

      - name: Install local Kubo CLI for required IPFS integration tests
        run: |
          docker create --name trustfl-kubo-cli ipfs/kubo:v0.32.1
          docker cp trustfl-kubo-cli:/usr/local/bin/ipfs /usr/local/bin/ipfs
          docker rm trustfl-kubo-cli
          ipfs --version

      - name: Install contract runtime dependencies
        working-directory: packages/contracts
        run: npm ci

      - name: Smoke-test Node ZKP runtime and circuit artifacts
        timeout-minutes: 5
        run: |
          node --input-type=module -e \
            "import('./packages/zkp/src/zkp.js').then(async ({computeCommitment, generateProof}) => { \
              try { \
                const value = await computeCommitment({clientId: 1n, federationId: 2n, roundId: 1n, modelVersion: 3n, privateUpdateCommitment: 4n}); \
                if (!value) process.exit(1); \
                const proof = await generateProof({clientId: 1n, federationId: 2n, roundId: 1n, modelVersion: 3n, privateUpdateCommitment: 4n}); \
                if (!proof || !proof.isValid) process.exit(1); \
                console.log('ZKP runtime and proof generation OK'); \
                process.exit(0); \
              } catch (err) { \
                console.error('ZKP smoke test failed:', err); \
                process.exit(1); \
              } \
            }).catch((err) => { \
              console.error('Failed to load ZKP module:', err); \
              process.exit(1); \
            })"

      - name: Generate release SBOMs
        run: python scripts/generate_sboms.py --output-dir dist/sboms

      - name: Lint
        run: ruff check .

      - name: Test
        run: |
          set -o pipefail
          pytest tests/ -v --tb=short 2>&1 | tee /tmp/pytest.log

      - name: Upload pytest failure summary
        if: failure()
        run: |
          echo "### Pytest Failure Details" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 120 /tmp/pytest.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload full pytest log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: python-tests-pytest-log
          path: /tmp/pytest.log
          if-no-files-found: ignore
          retention-days: 7

  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.13"
      - name: Validate repository supply-chain policy
        run: python scripts/validate_supply_chain.py
      - name: Validate production deployment configuration
        run: python scripts/validate_deployment.py
      - name: Audit Python dependencies
        run: |
          python -m pip install --requirement requirements-dev.txt
          pip-audit --requirement requirements.txt --strict
      - name: Generate and validate release SBOMs
        run: python scripts/generate_sboms.py --output-dir dist/sboms
      - name: Audit npm dependencies
        run: |
          for directory in apps/dashboard packages/contracts packages/zkp; do
            npm --prefix "$directory" ci --ignore-scripts
            npm --prefix "$directory" audit --omit=dev --audit-level=high
            rm -rf "$directory/node_modules"
          done
      - name: Scan workflows with zizmor
        run: zizmor --persona pedantic --min-severity low .github/workflows
      - name: Scan repository filesystem with Trivy
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          skip-dirs: "**/node_modules"
          trivy-config: trivy.yaml
          trivyignores: .trivyignore.yaml
      - name: Scan Helm chart with Trivy
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec
        with:
          scan-type: config
          scan-ref: deploy/helm/trustfl
          scanners: misconfig,secret
          severity: CRITICAL,HIGH
          exit-code: "1"
          trivy-config: trivy.yaml
          trivyignores: .trivyignore.yaml
      - name: Scan git history for secrets with gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz" | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --verbose --redact

  frontend-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json

      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build

  contract-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: packages/contracts/package-lock.json

      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npx hardhat compile
      - name: Verify committed contract types are current
        # working-directory is packages/contracts, so the pathspec must be relative to it
        run: |
          if [ -n "$(git status --porcelain -- types/ethers-contracts)" ]; then
            git status --porcelain -- types/ethers-contracts
            echo "Committed contract types are stale; regenerate and commit them." >&2
            exit 1
          fi
      - run: npx hardhat test

  zk-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/zkp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: packages/zkp/package-lock.json

      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test

  docker-build:
    needs: [python-tests, frontend-tests, contract-tests, zk-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build images
        run: |
          cargo install --locked --git https://github.com/iden3/circom.git --tag v2.2.3 circom
          cd packages/zkp
          npm ci
          npm run build
          cd ../..
          docker build -t trustfl-api -t ghcr.io/sayam-1705/trustfl/api:ci -f apps/api/Dockerfile .
          docker build -t trustfl-coordinator -t ghcr.io/sayam-1705/trustfl/coordinator:ci -f apps/coordinator/Dockerfile .
          docker build -t trustfl-client -t ghcr.io/sayam-1705/trustfl/client:ci -f apps/client/Dockerfile .
          docker build -t trustfl-dashboard -t ghcr.io/sayam-1705/trustfl/dashboard:ci apps/dashboard


      - name: Smoke-test Python package imports inside client image
        run: |
          set -Eeuo pipefail

          docker run --rm trustfl-client \
            python -m trustfl_crypto.provision --help

          docker run --rm trustfl-client \
            python -c "from trustfl_crypto.keys import ClientIdentity; print('trustfl_crypto OK')"

          docker run --rm trustfl-client \
            python -c "from trustfl_ml.dataset import resolve_and_validate_dataset; print('trustfl_ml OK')"

          docker run --rm trustfl-coordinator \
            python -c "from trustfl_crypto.keys import ClientIdentity; print('coordinator trustfl_crypto OK')"

          docker run --rm \
            -e ZKP_ARTIFACTS_DIR=/zkp-artifacts \
            -v "$PWD/packages/zkp/artifacts:/zkp-artifacts:ro" \
            trustfl-coordinator \
            sh -c '
              test -r /zkp-artifacts/verification_key.json
              out=$(printf "{\"proof\":{},\"publicSignals\":[]}\n" | node /app/packages/zkp/src/verify-cli.js)
              echo "ZKP verifier output: $out"
              echo "$out" | grep -q "\"valid\":false"
              echo "$out" | grep -q "\"reason\":\"invalid_proof\""
            '

          docker run --rm trustfl-api \
            env CORS_ALLOWED_ORIGINS=https://dashboard.example.test \
            python -c "import apps.api.main; print('apps.api.main OK')"

          docker run --rm trustfl-api \
            python -c "from apps.coordinator.zkp_verifier import ZKPVerifier; print('ZKPVerifier OK')"

          docker run --rm trustfl-api \
            python -c "import apps.api.api.services.proof_service; print('proof_service OK')"

      - name: Validate Compose configuration
        run: |
          mkdir -p /tmp/trustfl-contracts /tmp/trustfl-dataset /tmp/trustfl-zkp-artifacts
          docker compose config
          TRUSTFL_VERSION=ci \
          POSTGRES_PASSWORD=ci-db-password \
          API_READ_KEY=ci-read \
          API_WRITE_KEY=ci-write \
          API_ADMIN_KEY=ci-admin \
          CLIENT_KEY_STORE=secret_manager \
          DASHBOARD_ACCESS_KEY=ci-dashboard \
          COORDINATOR_ENROLLMENT_TOKEN=ci-coordinator \
          CORS_ALLOWED_ORIGINS=https://dashboard.example.test \
          BLOCKCHAIN_RPC_URL=https://rpc.example.test \
          BLOCKCHAIN_CONTRACTS_DIR=/tmp/trustfl-contracts \
          ZKP_ARTIFACTS_DIR=/tmp/trustfl-zkp-artifacts \
          COORDINATOR_PRIVATE_KEY=0x1111111111111111111111111111111111111111111111111111111111111111 \
          FL_DATASET_DIR=/tmp/trustfl-dataset \
          docker compose -f docker-compose.published.yml config

  compose-e2e:
    needs: docker-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"

      - name: Install dependencies for E2E validation
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Build ephemeral ZKP artifacts for E2E
        run: |
          cargo install --locked --git https://github.com/iden3/circom.git --tag v2.2.3 circom
          cd packages/zkp
          npm ci
          npm run build

      - name: Run Compose E2E
        shell: bash
        run: |
          set -Eeuo pipefail

          export COMPOSE_PROJECT_NAME="trustfl-ci-${GITHUB_RUN_ID}"
          export COORDINATOR_HOST_PORT=18100
          export API_AUTH_REQUIRED=true API_READ_KEY=ci-read API_WRITE_KEY=ci-write API_ADMIN_KEY=ci-admin
          export DASHBOARD_ACCESS_KEY=ci-dashboard COORDINATOR_ENROLLMENT_TOKEN=ci-coordinator
          export FL_DATASET_DIR=./datasets/sample
          export FL_NUM_CLIENTS=3
          export FL_MIN_CLIENTS=3
          # These must be set explicitly here so they are NOT inherited from any
          # .env file that may exist in the checkout (e.g. from a developer's
          # local Scenario 1 run that sets FL_FEDERATION_ID=fed-visdrone-local
          # and FL_NUM_ROUNDS=1).  Docker Compose auto-loads .env from CWD.
          export FL_FEDERATION_ID=fed-default
          export FL_NUM_ROUNDS=3
          export FL_MAX_CLIENT_WEIGHT_SHARE=0.5
          export FL_MAX_UPDATE_NORM=1.0
          # Compose's generated client keys are intentionally ephemeral.  The
          # E2E lifecycle therefore uses the documented explicit dev-only
          # enrollment compatibility mode; production never inherits this.
          export COORDINATOR_INSECURE_DEV_AUTH=true

          cleanup() {
            local status=$?
            if [[ "$status" -ne 0 ]]; then
              docker compose ps --all || true
              docker compose logs --no-color --tail=500 || true
            fi
            docker compose down --volumes --remove-orphans || true
            exit "$status"
          }
          trap cleanup EXIT

          http_get() {
            local url="$1"
            local token="${2:-${API_READ_KEY}}"
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer ${token}" \
              --connect-timeout 2 --max-time 10 \
              --retry 3 --retry-all-errors --retry-delay 1 "$url"
          }

          http_get_admin() {
            http_get "$1" "${API_ADMIN_KEY}"
          }

          wait_for_url() {
            local deadline=$((SECONDS + 180))
            until http_get "$1" >/dev/null 2>&1; do
              if (( SECONDS >= deadline )); then
                echo "Timed out waiting for: $1"
                return 1
              fi
              sleep 3
            done
            echo "Ready: $1"
          }

          wait_for_coordinator() {
            local deadline=$((SECONDS + 180))
            local container_id state

            while (( SECONDS < deadline )); do
              container_id="$(docker compose ps -q coordinator 2>/dev/null || true)"

              if [[ -n "$container_id" ]]; then
                if http_get "http://localhost:${COORDINATOR_HOST_PORT}/health" >/dev/null 2>&1; then
                  echo "Coordinator is ready."
                  return 0
                fi

                state="$(docker inspect --format '{{.State.Status}} {{.State.ExitCode}}' "$container_id" 2>/dev/null || true)"
                case "$state" in
                  "exited 0") echo "Coordinator completed with exit code 0."; return 0 ;;
                  exited*)    echo "Coordinator exited unexpectedly: $state"; return 1 ;;
                esac
              fi

              sleep 3
            done

            echo "Timed out waiting for coordinator."
            return 1
          }

          check_lifecycle() {
            local mode="${1:-poll}"
            local rounds updates transactions
            rounds="$(http_get "http://localhost:8000/rounds/federation/fed-default")" || return 1
            updates="$(http_get "http://localhost:8000/updates/federation/fed-default")" || return 1
            transactions="$(http_get_admin "http://localhost:8000/blockchain/transactions?limit=100")" || return 1

            python - "$rounds" "$updates" "$transactions" "$mode" <<'PY'
          import json
          import os
          import sys

          rounds, updates, transactions = map(json.loads, sys.argv[1:4])
          mode = sys.argv[4] if len(sys.argv) > 4 else "poll"

          rounds_list = rounds.get("data", [])
          updates_list = updates.get("data", [])
          txns_list = transactions.get("data", [])

          round_map = {int(r["round_number"]): r for r in rounds_list if "round_number" in r}
          finalized = {
              int(r["round_number"])
              for r in rounds_list
              if r.get("status") == "FINALIZED"
          }
          completed = {
              int(r["round_number"])
              for r in rounds_list
              if r.get("status") == "COMPLETED"
          }

          num_clients = int(os.environ.get("FL_NUM_CLIENTS", "3"))
          expected_clients = {f"client_{i:03d}" for i in range(1, num_clients + 1)}

          client_updates_per_round = {}
          for r_num in (1, 2, 3):
              r_id = f"fed-default_round{r_num}"
              verified_clients = {
                  u["client_id"]
                  for u in updates_list
                  if u.get("status") in {"VERIFIED", "AGGREGATED"}
                  and u.get("round_id") == r_id
                  and "client_id" in u
              }
              client_updates_per_round[r_num] = verified_clients

          confirmed_finalizations = {
              int(t["entity_id"])
              for t in txns_list
              if t.get("status") == "CONFIRMED"
              and t.get("contract_name") == "TrainingRoundRegistry"
              and t.get("function_name") == "finalizeRound"
              and t.get("entity_type") == "round"
              and str(t.get("entity_id", "")).isdigit()
          }

          errors = []

          # 1. Round finalization checks
          missing_rounds = {1, 2, 3} - set(round_map.keys())
          if missing_rounds:
              errors.append(f"Missing round records for rounds: {sorted(missing_rounds)}")

          non_finalized = {1, 2, 3} - finalized
          if non_finalized:
              status_details = [
                  f"Round {rn}: status={round_map[rn].get('status', 'MISSING')}"
                  for rn in sorted(non_finalized)
                  if rn in round_map
              ]
              errors.append(
                  f"Expected finalized rounds {{1, 2, 3}}; unfinalized: {sorted(non_finalized)} "
                  f"({', '.join(status_details)})"
              )

          # 2. Client update verification per round
          for r_num in (1, 2, 3):
              observed_clients = client_updates_per_round.get(r_num, set())
              missing = expected_clients - observed_clients
              if missing:
                  errors.append(
                      f"Round {r_num}: missing verified updates from {sorted(missing)}; "
                      f"observed {sorted(observed_clients)}"
                  )

          # 3. On-chain finalization transaction confirmation
          missing_txns = {1, 2, 3} - confirmed_finalizations
          if missing_txns:
              errors.append(
                  f"Missing confirmed finalizeRound blockchain transactions for rounds {sorted(missing_txns)}; "
                  f"observed {sorted(confirmed_finalizations)}"
              )

          # 4. Global model artifact presence
          for r_num in (1, 2, 3):
              r_obj = round_map.get(r_num, {})
              if not r_obj.get("global_model_artifact_id"):
                  errors.append(f"Round {r_num}: missing global_model_artifact_id on round record")

          if errors:
              if mode in ("assert", "verbose"):
                  print("\n" + "=" * 60, file=sys.stderr)
                  print("[-] E2E LIFECYCLE ACCEPTANCE FAILED:", file=sys.stderr)
                  for err in errors:
                      print(f"  * {err}", file=sys.stderr)
                  print("\n--- Diagnostic Dump ---", file=sys.stderr)
                  print("Observed Rounds:", file=sys.stderr)
                  for r in rounds_list:
                      print(f"  Round {r.get('round_number')}: status={r.get('status')} model_version={r.get('model_version')} artifact_id={r.get('global_model_artifact_id')}", file=sys.stderr)
                  print("Observed Updates (sample):", file=sys.stderr)
                  for u in updates_list[:15]:
                      print(f"  Update {u.get('id')}: round={u.get('round_id')} client={u.get('client_id')} status={u.get('status')}", file=sys.stderr)
                  if len(updates_list) > 15:
                      print(f"  ... ({len(updates_list) - 15} more updates)", file=sys.stderr)
                  print("Observed Blockchain Transactions:", file=sys.stderr)
                  for t in txns_list:
                      print(f"  Tx {t.get('tx_hash', '')[:10]}...: fn={t.get('function_name')} entity={t.get('entity_type')} id={t.get('entity_id')} status={t.get('status')}", file=sys.stderr)
                  print("=" * 60 + "\n", file=sys.stderr)
              sys.exit(1)

          print(f"Finalized rounds:        {sorted(finalized)}")
          print(f"Expected clients:        {sorted(expected_clients)}")
          print(f"Confirmed finalizations: {sorted(confirmed_finalizations)}")
          PY
          }

          export FL_NUM_CLIENTS=3
          export FL_MIN_CLIENTS=3

          # Generate sample dataset BEFORE starting the stack so it is present
          # when client containers mount the volume.

          echo "Generating sample dataset (30 mock images for 3 clients)..."
          python3 scripts/generate_sample_dataset.py \
            --output-dir ./datasets/sample \
            --train-samples 30 \
            --val-samples 3

          echo "Validating generated dataset..."
          test -d ./datasets/sample/images
          test -d ./datasets/sample/annotations
          test -d ./datasets/sample/val/images
          test -d ./datasets/sample/val/annotations

          python3 -c '
          from pathlib import Path
          root = Path("./datasets/sample")
          images = list((root / "images").glob("*"))
          annotations = list((root / "annotations").glob("*.txt"))
          assert len(images) == 30, f"Expected 30 training images, got {len(images)}"
          assert len(annotations) == 30, f"Expected 30 training annotations, got {len(annotations)}"
          print(f"Dataset OK: {len(images)} training images and {len(annotations)} annotations")
          '


          # Write a CI-specific .env so Docker Compose does not auto-load any
          # developer .env that may have been committed or cached, and to ensure
          # FL_FEDERATION_ID / FL_NUM_ROUNDS / FL_MAX_CLIENT_WEIGHT_SHARE are
          # exactly what CI expects regardless of repository checkout state.
          # Use printf to avoid heredoc indentation issues (YAML indents content
          # but bash heredoc preserves those leading spaces into the .env file,
          # causing Docker Compose to treat "          KEY=val" as an invalid key).
          printf '%s\n' \
            'POSTGRES_USER=trustfl' \
            'POSTGRES_PASSWORD=trustfl' \
            'POSTGRES_DB=trustfl' \
            'ENVIRONMENT=development' \
            'FL_FEDERATION_ID=fed-default' \
            'FL_NUM_ROUNDS=3' \
            'FL_NUM_CLIENTS=3' \
            'FL_MIN_CLIENTS=3' \
            'FL_MAX_CLIENT_WEIGHT_SHARE=0.5' \
            'FL_MAX_UPDATE_NORM=1.0' \
            'FL_LOCAL_EPOCHS=1' \
            'FL_MAX_SAMPLES=50' \
            'FL_POLL_INTERVAL_SECONDS=3.0' \
            'COORDINATOR_REQUIRE_SIGNATURES=true' \
            'COORDINATOR_INSECURE_DEV_AUTH=true' \
            > .env
          echo "Written CI .env (first line check):"
          head -1 .env | cat -A

          echo "Starting Compose stack (FL_NUM_CLIENTS=3, FL_FEDERATION_ID=fed-default, FL_NUM_ROUNDS=3)..."
          docker compose up --build -d

          echo "Waiting for services..."
          wait_for_url "http://localhost:8000/health/"
          wait_for_url "http://localhost:3000/"
          wait_for_coordinator

          docker compose exec -T db pg_isready \
            -U "${POSTGRES_USER:-trustfl}" -d "${POSTGRES_DB:-trustfl}"

          docker compose exec -T ipfs \
            wget -qO- --post-data= http://localhost:5001/api/v0/id >/dev/null

          docker compose exec -T hardhat node -e "
            fetch('http://localhost:8545', {
              method: 'POST',
              headers: {'content-type': 'application/json'},
              body: JSON.stringify({jsonrpc: '2.0', id: 1, method: 'net_version', params: []})
            })
              .then(r => process.exit(r.ok ? 0 : 1))
              .catch(() => process.exit(1));
          "

          echo "Waiting for signed FL lifecycle..."
          deadline=$((SECONDS + 600))
          until check_lifecycle "poll"; do
            # Check if any container exited with an unexpected failure
            exited_failed="$(docker compose ps -a --format '{{.Service}} {{.State}} {{.ExitCode}}' | grep -v 'client-init' | grep -v 'contract-deployer' | grep -E 'exited ([1-9]|1[0-9]|2[0-9])' || true)"
            if [[ -n "$exited_failed" ]]; then
              echo "Error: Container(s) exited unexpectedly: $exited_failed"
              check_lifecycle "verbose" || true
              docker compose logs --no-color
              exit 1
            fi
            if (( SECONDS >= deadline )); then
              echo "FL lifecycle timed out after 600s. Running diagnostic dump:"
              check_lifecycle "verbose" || true
              docker compose logs --no-color
              exit 1
            fi
            sleep 5
          done

          echo "Verifying dashboard..."
          dashboard="$(curl --fail --silent --show-error --location -H "Authorization: Bearer ${DASHBOARD_ACCESS_KEY}" "http://localhost:3000/api/dashboard/federations/")"

          unauthenticated="$(curl --silent --show-error --location -o /dev/null -w '%{http_code}' http://localhost:8000/federations/)"
          [[ "$unauthenticated" == "401" ]] || { echo "Expected unauthenticated API request to return 401, got $unauthenticated"; exit 1; }

          echo "Verifying least-privilege authorization gates..."
          http_get_admin "http://localhost:8000/blockchain/transactions?limit=10" >/dev/null

          read_tx_code="$(curl --silent --show-error --location -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${API_READ_KEY}" \
            http://localhost:8000/blockchain/transactions?limit=100)"
          [[ "$read_tx_code" == "403" ]] || { echo "Expected 403 for read key on /blockchain/transactions, got $read_tx_code"; exit 1; }

          unauth_tx_code="$(curl --silent --show-error --location -o /dev/null -w '%{http_code}' \
            http://localhost:8000/blockchain/transactions?limit=100)"
          [[ "$unauth_tx_code" == "401" ]] || { echo "Expected 401 for unauthenticated on /blockchain/transactions, got $unauth_tx_code"; exit 1; }

          python - "$dashboard" <<'PY'
          import json
          import sys

          payload = json.loads(sys.argv[1])
          data = payload.get("data")

          if payload.get("success") is not True:
              sys.exit(f"Dashboard API unsuccessful: {payload!r}")
          if not isinstance(data, list):
              sys.exit(f"Dashboard federation data is not a list: {data!r}")
          if not any(isinstance(i, dict) and i.get("id") == "fed-default" for i in data):
              sys.exit(f"fed-default not visible in dashboard data: {data!r}")

          print("Dashboard federation visibility verified.")
          PY

          check_lifecycle "assert"

          echo "TrustFL Compose E2E PASSED"
