name: TrustFL CI

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*', 'stage-*' ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-checks:
    name: Lint, Test & Audit (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Create virtual environment & install dependencies
        run: |
          uv venv .venv --python 3.11
          source .venv/bin/activate
          uv pip install -e ".[dev]"

      - name: Run Ruff Lint
        run: |
          source .venv/bin/activate
          ruff check .

      - name: Run Ruff Format Check
        run: |
          source .venv/bin/activate
          ruff format --check .

      - name: Run Mypy Type Check
        run: |
          source .venv/bin/activate
          mypy packages apps

      - name: Run Pytest Suites
        run: |
          source .venv/bin/activate
          pytest tests

      - name: Audit Repository for Sensitive Artifacts (Zero-Git Invariant)
        run: |
          make audit

  dashboard-checks:
    name: Next.js Dashboard Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/dashboard/package.json

      - name: Install dependencies & lint
        working-directory: apps/dashboard
        run: |
          npm ci || npm install
          npm run lint || true
