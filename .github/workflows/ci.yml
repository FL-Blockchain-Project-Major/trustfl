name: TrustFL CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest tests/

  frontend-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build

  contract-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: packages/contracts/package-lock.json

      - run: npm ci
      - run: npx hardhat compile
      - name: Verify committed contract types are current
        run: git diff --exit-code -- packages/contracts/types/ethers-contracts
      - run: npx hardhat test

  zk-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/zkp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: packages/zkp/package-lock.json

      - run: npm ci
      - run: npm test

  docker-build:
    needs: [python-tests, frontend-tests, contract-tests, zk-tests]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: |
          docker build -t trustfl-api -t ghcr.io/sayam-1705/trustfl/api:ci -f apps/api/Dockerfile .
          docker build -t trustfl-coordinator -t ghcr.io/sayam-1705/trustfl/coordinator:ci -f apps/coordinator/Dockerfile .
          docker build -t trustfl-client -t ghcr.io/sayam-1705/trustfl/client:ci -f apps/client/Dockerfile .
          docker build -t trustfl-dashboard -t ghcr.io/sayam-1705/trustfl/dashboard:ci apps/dashboard

      - name: Smoke-test Python package imports inside client image
        # Catches PYTHONPATH misconfigurations that would break client-init
        # and any other module-as-script invocations inside the container.
        run: |
          docker run --rm trustfl-client python -m trustfl_crypto.provision --help
          docker run --rm trustfl-client python -c "from trustfl_crypto.keys import ClientIdentity; print('trustfl_crypto OK')"
          docker run --rm trustfl-client python -c "from trustfl_ml.dataset import resolve_and_validate_dataset; print('trustfl_ml OK')"
          docker run --rm trustfl-coordinator python -c "from trustfl_crypto.keys import ClientIdentity; print('coordinator trustfl_crypto OK')"

      - name: Validate Compose configuration
        run: docker compose config

  compose-e2e:
    needs: docker-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run Compose E2E
        shell: bash
        run: |
          set -Eeuo pipefail

          export COMPOSE_PROJECT_NAME="trustfl-ci-${GITHUB_RUN_ID}"
          export COORDINATOR_HOST_PORT=18100
          export API_AUTH_REQUIRED=true API_READ_KEY=ci-read API_WRITE_KEY=ci-write API_ADMIN_KEY=ci-admin
          export DASHBOARD_ACCESS_KEY=ci-dashboard COORDINATOR_ENROLLMENT_TOKEN=ci-coordinator
          export FL_DATASET_DIR=./datasets/sample
          export FL_NUM_CLIENTS=3
          export FL_MIN_CLIENTS=3
          # These must be set explicitly here so they are NOT inherited from any
          # .env file that may exist in the checkout (e.g. from a developer's
          # local Scenario 1 run that sets FL_FEDERATION_ID=fed-visdrone-local
          # and FL_NUM_ROUNDS=1).  Docker Compose auto-loads .env from CWD.
          export FL_FEDERATION_ID=fed-default
          export FL_NUM_ROUNDS=3
          export FL_MAX_CLIENT_WEIGHT_SHARE=0.5
          # Compose's generated client keys are intentionally ephemeral.  The
          # E2E lifecycle therefore uses the documented explicit dev-only
          # enrollment compatibility mode; production never inherits this.
          export COORDINATOR_INSECURE_DEV_AUTH=true

          cleanup() {
            local status=$?
            if [[ "$status" -ne 0 ]]; then
              docker compose ps --all || true
              docker compose logs --no-color --tail=500 || true
            fi
            docker compose down --volumes --remove-orphans || true
            exit "$status"
          }
          trap cleanup EXIT

          http_get() {
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer ${API_READ_KEY}" \
              --connect-timeout 2 --max-time 10 \
              --retry 3 --retry-all-errors --retry-delay 1 "$1"
          }

          wait_for_url() {
            local deadline=$((SECONDS + 180))
            until http_get "$1" >/dev/null 2>&1; do
              if (( SECONDS >= deadline )); then
                echo "Timed out waiting for: $1"
                return 1
              fi
              sleep 3
            done
            echo "Ready: $1"
          }

          wait_for_coordinator() {
            local deadline=$((SECONDS + 180))
            local container_id state

            while (( SECONDS < deadline )); do
              container_id="$(docker compose ps -q coordinator 2>/dev/null || true)"

              if [[ -n "$container_id" ]]; then
                if http_get "http://localhost:${COORDINATOR_HOST_PORT}/health" >/dev/null 2>&1; then
                  echo "Coordinator is ready."
                  return 0
                fi

                state="$(docker inspect --format '{{.State.Status}} {{.State.ExitCode}}' "$container_id" 2>/dev/null || true)"
                case "$state" in
                  "exited 0") echo "Coordinator completed with exit code 0."; return 0 ;;
                  exited*)    echo "Coordinator exited unexpectedly: $state"; return 1 ;;
                esac
              fi

              sleep 3
            done

            echo "Timed out waiting for coordinator."
            return 1
          }

          check_lifecycle() {
            local rounds updates transactions
            rounds="$(http_get "http://localhost:8000/rounds/federation/fed-default")" || return 1
            updates="$(http_get "http://localhost:8000/updates/federation/fed-default")" || return 1
            transactions="$(http_get "http://localhost:8000/blockchain/transactions?limit=100")" || return 1

            python - "$rounds" "$updates" "$transactions" <<'PY'
          import json
          import os
          import sys

          rounds, updates, transactions = map(json.loads, sys.argv[1:])

          finalized = {
              int(r["round_number"])
              for r in rounds.get("data", [])
              if r.get("status") == "FINALIZED"
          }
          if not {1, 2, 3} <= finalized:
              sys.exit(f"Expected finalized rounds {{1, 2, 3}}, got {sorted(finalized)}")

          clients = {
              u["client_id"]
              for u in updates.get("data", [])
              if u.get("status") in {"VERIFIED", "AGGREGATED"} and "client_id" in u
          }
          num_clients = int(os.environ.get("FL_NUM_CLIENTS", "2"))
          expected_clients = {f"client_{i:03d}" for i in range(1, num_clients + 1)}
          for round_number in (1, 2, 3):
              round_clients = {u["client_id"] for u in updates.get("data", [])
                               if u.get("status") in {"VERIFIED", "AGGREGATED"}
                               and u.get("round_id") == f"fed-default_round{round_number}"}
              if not expected_clients <= round_clients:
                  sys.exit(f"Round {round_number} missing verified/aggregated updates from expected clients {sorted(expected_clients)}: got {sorted(round_clients)}")

          confirmed_finalizations = {
              int(t["entity_id"])
              for t in transactions.get("data", [])
              if t.get("status") == "CONFIRMED"
              and t.get("contract_name") == "TrainingRoundRegistry"
              and t.get("function_name") == "finalizeRound"
              and t.get("entity_type") == "round"
              and str(t.get("entity_id", "")).isdigit()
          }
          if not {1, 2, 3} <= confirmed_finalizations:
              sys.exit(
                  "Expected a CONFIRMED finalizeRound transaction for each round; "
                  f"got {sorted(confirmed_finalizations)}"
              )

          print(f"Finalized rounds: {sorted(finalized)}")
          print(f"Verified/aggregated clients: {sorted(clients)}")
          print(f"Confirmed round finalizations: {sorted(confirmed_finalizations)}")
          PY
          }

          export FL_NUM_CLIENTS=3
          export FL_MIN_CLIENTS=3

          # Generate sample dataset BEFORE starting the stack so it is present
          # when client containers mount the volume.  Falls back gracefully to an
          # empty directory; clients will use the synthetic training function.
          echo "Generating sample dataset (30 mock images for 3 clients)..."
          python scripts/generate_sample_dataset.py --out-dir ./datasets/sample --train-samples 30 \
            || mkdir -p ./datasets/sample/images ./datasets/sample/annotations

          # Write a CI-specific .env so Docker Compose does not auto-load any
          # developer .env that may have been committed or cached, and to ensure
          # FL_FEDERATION_ID / FL_NUM_ROUNDS / FL_MAX_CLIENT_WEIGHT_SHARE are
          # exactly what CI expects regardless of repository checkout state.
          cat > .env <<'ENVEOF'
POSTGRES_USER=trustfl
POSTGRES_PASSWORD=trustfl
POSTGRES_DB=trustfl
ENVIRONMENT=development
FL_FEDERATION_ID=fed-default
FL_NUM_ROUNDS=3
FL_NUM_CLIENTS=3
FL_MIN_CLIENTS=3
FL_MAX_CLIENT_WEIGHT_SHARE=0.5
FL_LOCAL_EPOCHS=1
FL_MAX_SAMPLES=50
FL_POLL_INTERVAL_SECONDS=3.0
COORDINATOR_REQUIRE_SIGNATURES=true
COORDINATOR_INSECURE_DEV_AUTH=true
ENVEOF

          echo "Starting Compose stack (FL_NUM_CLIENTS=3, FL_FEDERATION_ID=fed-default, FL_NUM_ROUNDS=3)..."
          docker compose up --build -d

          echo "Waiting for services..."
          wait_for_url "http://localhost:8000/health/"
          wait_for_url "http://localhost:3000/"
          wait_for_coordinator

          docker compose exec -T db pg_isready \
            -U "${POSTGRES_USER:-trustfl}" -d "${POSTGRES_DB:-trustfl}"

          docker compose exec -T ipfs \
            wget -qO- --post-data= http://localhost:5001/api/v0/id >/dev/null

          docker compose exec -T hardhat node -e "
            fetch('http://localhost:8545', {
              method: 'POST',
              headers: {'content-type': 'application/json'},
              body: JSON.stringify({jsonrpc: '2.0', id: 1, method: 'net_version', params: []})
            })
              .then(r => process.exit(r.ok ? 0 : 1))
              .catch(() => process.exit(1));
          "

          echo "Waiting for signed FL lifecycle..."
          deadline=$((SECONDS + 600))
          until check_lifecycle; do
            if (( SECONDS >= deadline )); then
              echo "FL lifecycle timed out"
              exit 1
            fi
            sleep 5
          done

          echo "Verifying dashboard..."
          dashboard="$(curl --fail --silent --show-error --location -H "Authorization: Bearer ${DASHBOARD_ACCESS_KEY}" "http://localhost:3000/api/dashboard/federations/")"

          unauthenticated="$(curl --silent --show-error --location -o /dev/null -w '%{http_code}' http://localhost:8000/federations/)"
          [[ "$unauthenticated" == "401" ]] || { echo "Expected unauthenticated API request to return 401, got $unauthenticated"; exit 1; }

          python - "$dashboard" <<'PY'
          import json
          import sys

          payload = json.loads(sys.argv[1])
          data = payload.get("data")

          if payload.get("success") is not True:
              sys.exit(f"Dashboard API unsuccessful: {payload!r}")
          if not isinstance(data, list):
              sys.exit(f"Dashboard federation data is not a list: {data!r}")
          if not any(isinstance(i, dict) and i.get("id") == "fed-default" for i in data):
              sys.exit(f"fed-default not visible in dashboard data: {data!r}")

          print("Dashboard federation visibility verified.")
          PY

          check_lifecycle

          echo "TrustFL Compose E2E PASSED"
