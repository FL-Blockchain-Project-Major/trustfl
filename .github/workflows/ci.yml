name: TrustFL CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  python-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check .

      - name: Run Python tests
        run: pytest tests/

  frontend-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/dashboard

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: "npm"
          cache-dependency-path: "apps/dashboard/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests
        run: npm test

      - name: Build dashboard
        run: npm run build

  contract-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: packages/contracts

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: "npm"
          cache-dependency-path: "packages/contracts/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npx hardhat compile

      - name: Test contracts
        run: npx hardhat test

  zk-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: packages/zkp

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"

      - name: Install ZKP dependencies
        run: npm ci

      - name: Run ZKP tests
        run: npm test

  docker-build:
    needs:
      - python-tests
      - frontend-tests
      - contract-tests
      - zk-tests

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t trustfl-api -f apps/api/Dockerfile .

      - name: Build coordinator image
        run: docker build -t trustfl-coordinator -f apps/coordinator/Dockerfile .

      - name: Build client image
        run: docker build -t trustfl-client -f apps/client/Dockerfile .

      - name: Build dashboard image
        run: |
          cd apps/dashboard
          docker build -t trustfl-dashboard -f Dockerfile .

      - name: Validate Compose configuration
        run: docker compose config

  compose-e2e:
    needs: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Run full TrustFL Compose E2E
        shell: bash
        run: |
          set -Eeuo pipefail

          export COMPOSE_PROJECT_NAME="trustfl-ci-${GITHUB_RUN_ID}"
          export COORDINATOR_HOST_PORT=18100

          cleanup() {
            status=$?

            echo "=================================================="
            echo "TrustFL E2E cleanup"
            echo "=================================================="

            echo "=== Compose status ==="
            docker compose ps --all || true

            echo "=== Compose logs ==="
            docker compose logs --no-color --tail=300 || true

            echo "=== Stopping Compose stack ==="
            docker compose down --volumes --remove-orphans || true

            exit "$status"
          }

          trap cleanup EXIT

          echo "=================================================="
          echo "Starting TrustFL Compose stack"
          echo "=================================================="

          docker compose up --build -d

          echo "=================================================="
          echo "Waiting for infrastructure"
          echo "=================================================="

          wait_for_url() {
            local url="$1"
            local timeout_seconds="${2:-180}"
            local deadline=$((SECONDS + timeout_seconds))

            while (( SECONDS < deadline )); do
              if curl \
                --fail \
                --silent \
                --show-error \
                --connect-timeout 2 \
                --max-time 10 \
                --retry 2 \
                --retry-all-errors \
                "$url" >/dev/null 2>&1; then
                echo "Ready: $url"
                return 0
              fi

              sleep 3
            done

            echo "Timed out waiting for: $url"
            return 1
          }

          wait_for_url "http://localhost:8000/health/" 180
          wait_for_url "http://localhost:3000/" 180

          echo "Checking coordinator..."

          coordinator_container="$(docker compose ps -q coordinator 2>/dev/null || true)"
          coordinator_state=""

          if [[ -n "$coordinator_container" ]]; then
            coordinator_state="$(
              docker inspect \
                --format '{{.State.Status}} {{.State.ExitCode}}' \
                "$coordinator_container" \
                2>/dev/null || true
            )"
          fi

          coordinator_ready=false

          if curl \
            --fail \
            --silent \
            --show-error \
            --connect-timeout 2 \
            --max-time 10 \
            --retry 5 \
            --retry-all-errors \
            "http://localhost:${COORDINATOR_HOST_PORT}/health" >/dev/null 2>&1; then
            coordinator_ready=true
          elif [[ "$coordinator_state" == "exited 0" ]]; then
            # The coordinator may have completed the entire FL lifecycle
            # before this explicit readiness check.
            coordinator_ready=true
          fi

          if [[ "$coordinator_ready" != true ]]; then
            echo "Coordinator failed readiness check."
            echo "Coordinator state: ${coordinator_state:-unknown}"
            exit 1
          fi

          echo "Coordinator ready."

          echo "Checking PostgreSQL..."

          docker compose exec -T db \
            pg_isready \
            -U "${POSTGRES_USER:-trustfl}" \
            -d "${POSTGRES_DB:-trustfl}"

          echo "Checking IPFS..."

          docker compose exec -T ipfs \
            wget -qO- \
            --post-data= \
            http://localhost:5001/api/v0/id >/dev/null

          echo "Checking Hardhat..."

          docker compose exec -T hardhat \
            node -e "
              fetch('http://localhost:8545', {
                method: 'POST',
                headers: {'content-type': 'application/json'},
                body: JSON.stringify({
                  jsonrpc: '2.0',
                  id: 1,
                  method: 'net_version',
                  params: []
                })
              })
              .then(response => {
                if (!response.ok) process.exit(1);
              })
              .catch(() => process.exit(1));
            "

          echo "=================================================="
          echo "Infrastructure is ready"
          echo "=================================================="

          echo "=== Compose services ==="
          docker compose ps --all

          echo "=================================================="
          echo "Waiting for signed FL lifecycle"
          echo "=================================================="

          fetch_json() {
            local url="$1"

            curl \
              --fail \
              --silent \
              --show-error \
              --connect-timeout 2 \
              --max-time 10 \
              --retry 5 \
              --retry-all-errors \
              --retry-delay 1 \
              "$url"
          }

          lifecycle_timeout_seconds=600
          lifecycle_deadline=$((SECONDS + lifecycle_timeout_seconds))
          lifecycle_passed=false

          while (( SECONDS < lifecycle_deadline )); do
            echo "Checking FL lifecycle..."

            rounds="$(fetch_json \
              "http://localhost:8000/rounds/federation/fed-default")" || {
                sleep 3
                continue
              }

            updates="$(fetch_json \
              "http://localhost:8000/updates/federation/fed-default")" || {
                sleep 3
                continue
              }

            transactions="$(fetch_json \
              "http://localhost:8000/blockchain/transactions?limit=100")" || {
                sleep 3
                continue
              }

            if python - "$rounds" "$updates" "$transactions" <<'PY'
          import json
          import sys

          rounds, updates, transactions = map(json.loads, sys.argv[1:])

          round_data = rounds.get("data", [])
          update_data = updates.get("data", [])
          transaction_data = transactions.get("data", [])

          assert any(
              item.get("status") == "FINALIZED"
              for item in round_data
          ), "No FINALIZED round found"

          assert any(
              item.get("status") in {"VERIFIED", "AGGREGATED"}
              for item in update_data
          ), "No VERIFIED/AGGREGATED update found"

          assert any(
              item.get("status") == "CONFIRMED"
              for item in transaction_data
          ), "No CONFIRMED blockchain transaction found"
          PY
            then
              lifecycle_passed=true
              echo "Signed FL lifecycle completed successfully."
              break
            fi

            sleep 5
          done

          if [[ "$lifecycle_passed" != true ]]; then
            echo "=================================================="
            echo "FL lifecycle timed out"
            echo "=================================================="

            docker compose ps --all
            docker compose logs --no-color --tail=500 \
              coordinator \
              client-1 \
              client-2 \
              api

            exit 1
          fi

          echo "=================================================="
          echo "Verifying dashboard visibility"
          echo "=================================================="

          dashboard="$(fetch_json \
            "http://localhost:3000/api/dashboard/federations/")"

          python - "$dashboard" <<'PY'
          import json
          import sys

          payload = json.loads(sys.argv[1])

          assert payload.get("success") is True, (
              f"Dashboard API unsuccessful: {payload!r}"
          )
          PY

          echo "Dashboard API verification passed."

          echo "=================================================="
          echo "Verifying final lifecycle state"
          echo "=================================================="

          final_rounds="$(fetch_json \
            "http://localhost:8000/rounds/federation/fed-default")"

          final_updates="$(fetch_json \
            "http://localhost:8000/updates/federation/fed-default")"

          final_transactions="$(fetch_json \
            "http://localhost:8000/blockchain/transactions?limit=100")"

          python \
            "$final_rounds" \
            "$final_updates" \
            "$final_transactions" <<'PY'
          import json
          import sys

          rounds, updates, transactions = map(json.loads, sys.argv[1:])

          finalized_rounds = [
              r for r in rounds.get("data", [])
              if r.get("status") == "FINALIZED"
          ]

          valid_updates = [
              u for u in updates.get("data", [])
              if u.get("status") in {"VERIFIED", "AGGREGATED"}
          ]

          confirmed_transactions = [
              t for t in transactions.get("data", [])
              if t.get("status") == "CONFIRMED"
          ]

          assert finalized_rounds, "No finalized federation round found"
          assert valid_updates, "No verified/aggregated update found"
          assert confirmed_transactions, "No confirmed blockchain transaction found"

          print(
              f"Finalized rounds: {len(finalized_rounds)}"
          )
          print(
              f"Verified/aggregated updates: {len(valid_updates)}"
          )
          print(
              f"Confirmed blockchain transactions: "
              f"{len(confirmed_transactions)}"
          )
          PY

          echo "=================================================="
          echo "TrustFL Compose E2E PASSED"
          echo "=================================================="
