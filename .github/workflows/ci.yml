name: TrustFL CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          
      - name: Lint with ruff
        run: ruff check .

      - name: Run Python Pytest
        run: pytest tests/

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'apps/dashboard/package-lock.json'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run Jest Tests
        run: npm test

      - name: Build dashboard
        run: npm run build

  contract-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'packages/contracts/package-lock.json'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Compile Contracts
        run: npx hardhat compile
        
      - name: Test Contracts
        run: npx hardhat test

  zk-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/zkp
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install ZKP dependencies
        run: npm ci
        
      - name: Run ZKP commitment and invalid-proof tests
        run: npm test

  docker-build:
    needs: [python-tests, frontend-tests, contract-tests, zk-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build API Image
        run: docker build -t trustfl-api -f apps/api/Dockerfile .
        
      - name: Build Coordinator Image
        run: docker build -t trustfl-coordinator -f apps/coordinator/Dockerfile .

      - name: Build Client Image
        run: docker build -t trustfl-client -f apps/client/Dockerfile .
        
      - name: Build Dashboard Image
        run: cd apps/dashboard && docker build -t trustfl-dashboard -f Dockerfile .

      - name: Validate Compose configuration
        run: docker compose config
