name: TrustFL CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          
      - name: Lint with ruff
        run: ruff check .

      - name: Run Python Pytest
        run: pytest tests/

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: 'npm'
          cache-dependency-path: 'apps/dashboard/package-lock.json'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run Jest Tests
        run: npm test

      - name: Build dashboard
        run: npm run build

  contract-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: 'npm'
          cache-dependency-path: 'packages/contracts/package-lock.json'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Compile Contracts
        run: npx hardhat compile
        
      - name: Test Contracts
        run: npx hardhat test

  zk-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/zkp
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          
      - name: Install ZKP dependencies
        run: npm ci
        
      - name: Run ZKP commitment and invalid-proof tests
        run: npm test

  docker-build:
    needs: [python-tests, frontend-tests, contract-tests, zk-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build API Image
        run: docker build -t trustfl-api -f apps/api/Dockerfile .
        
      - name: Build Coordinator Image
        run: docker build -t trustfl-coordinator -f apps/coordinator/Dockerfile .

      - name: Build Client Image
        run: docker build -t trustfl-client -f apps/client/Dockerfile .
        
      - name: Build Dashboard Image
        run: cd apps/dashboard && docker build -t trustfl-dashboard -f Dockerfile .

      - name: Validate Compose configuration
        run: docker compose config

  compose-e2e:
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start full Compose stack
        run: |
          set -euo pipefail
          export COORDINATOR_HOST_PORT=18100
          trap 'docker compose ps --all; docker compose logs --no-color --tail=300; docker compose down --volumes --remove-orphans' EXIT
          docker compose up --build -d

          ready=false
          for attempt in $(seq 1 90); do
            coordinator_state="$(docker inspect --format '{{.State.Status}} {{.State.ExitCode}}' "${COMPOSE_PROJECT_NAME:-trustfl}-coordinator-1" 2>/dev/null || true)"
            if curl --fail --silent --show-error --connect-timeout 2 --max-time 10 --retry 2 --retry-all-errors http://localhost:8000/health/ >/dev/null \
              && curl --fail --silent --show-error --connect-timeout 2 --max-time 10 --retry 2 --retry-all-errors http://localhost:3000/ >/dev/null \
              && { curl --fail --silent --show-error --connect-timeout 2 --max-time 10 --retry 2 --retry-all-errors http://localhost:18100/health >/dev/null || [ "$coordinator_state" = "exited 0" ]; } \
              && docker compose exec -T db pg_isready -U "${POSTGRES_USER:-trustfl}" -d "${POSTGRES_DB:-trustfl}" >/dev/null \
              && docker compose exec -T ipfs wget -qO- --post-data= http://localhost:5001/api/v0/id >/dev/null \
              && docker compose exec -T hardhat node -e "fetch('http://localhost:8545',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:'net_version',params:[]})}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))" \
              && { [ "$(docker compose ps --status running --services | grep -c '^coordinator$')" -eq 1 ] || [ "$coordinator_state" = "exited 0" ]; }; then
              ready=true
              break
            fi
            sleep $((attempt < 10 ? 2 : 5))
          done
          "$ready" = true || { docker compose ps --all; docker compose logs --no-color --tail=300; exit 1; }

      - name: Verify signed FL lifecycle and dashboard visibility
        run: |
          set -euo pipefail
          export COORDINATOR_HOST_PORT=18100
          fetch_json() {
            local url="$1"
            curl --fail --silent --show-error --connect-timeout 2 --max-time 10 \
              --retry 5 --retry-all-errors --retry-delay 1 "$url"
          }
          ready=false
          for attempt in $(seq 1 90); do
            rounds="$(fetch_json http://localhost:8000/rounds/federation/fed-default)" || { sleep 2; continue; }
            updates="$(fetch_json http://localhost:8000/updates/federation/fed-default)" || { sleep 2; continue; }
            transactions="$(fetch_json 'http://localhost:8000/blockchain/transactions?limit=100')" || { sleep 2; continue; }
            if python -c 'import json,sys; r,u,t=map(json.loads,sys.argv[1:]); assert any(x["status"]=="FINALIZED" for x in r["data"]); assert any(x["status"] in ("VERIFIED","AGGREGATED") for x in u["data"]); assert any(x["status"]=="CONFIRMED" for x in t["data"])' "$rounds" "$updates" "$transactions"; then
              ready=true
              break
            fi
            sleep 5
          done
          "$ready" = true || { docker compose ps --all; docker compose logs --no-color --tail=300; exit 1; }

          dashboard="$(fetch_json http://localhost:3000/api/dashboard/federations/)"
          python -c 'import json,sys; assert json.loads(sys.argv[1])["success"] is True' "$dashboard"
