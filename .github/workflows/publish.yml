# Publish TrustFL Docker images to GHCR.
#
# Trigger: push of a tag matching v* (e.g. v0.1.0).
# Branch pushes do NOT publish images.  This avoids ambiguity between a moving
# "edge" tag and immutable release tags, and prevents publishing unverified
# commits.
#
# Release gate: the workflow runs the same Python test, lint, and Docker build
# checks as ci.yml before pushing any image.  Cross-workflow "needs" across
# separate workflow files is unreliable (only works for the same workflow file),
# so the gate is implemented as explicit required jobs in this file.
#
# Image namespace: ghcr.io/sayam-1705/trustfl/<service>
#   Packages are created automatically on first push if the GITHUB_TOKEN has
#   packages:write permission and the repository owner has granted it.
#
# ── Required one-time manual GitHub settings ─────────────────────────────────
# 1. Repository → Settings → Actions → General → Workflow permissions
#    → select "Read and write permissions"  (enables packages:write for GITHUB_TOKEN)
# 2. After the first successful publish, go to each package's settings page
#    (ghcr.io → your packages) and set visibility to Public if desired.
# ─────────────────────────────────────────────────────────────────────────────

name: Publish Docker Images

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # ── Release gate: Python tests and lint ──────────────────────────────────
  python-tests:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install --no-deps -e .

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest tests/

      - name: Validate release supply-chain policy
        run: python scripts/validate_supply_chain.py

      - name: Generate release SBOMs
        run: python scripts/generate_sboms.py --output-dir dist/sboms

  javascript-tests:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.13"

      - name: Dashboard tests and build
        working-directory: apps/dashboard
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm test
          npm run build

      - name: Contract tests and compile
        working-directory: packages/contracts
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npx hardhat compile
          npx hardhat test

      - name: ZKP tests
        working-directory: packages/zkp
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm test

  # ── Release gate: Docker builds + import smoke tests ─────────────────────
  docker-verify:
    needs: [python-tests, javascript-tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Build all images
        run: |
          docker build -t trustfl-api       -f apps/api/Dockerfile .
          docker build -t trustfl-coordinator -f apps/coordinator/Dockerfile .
          docker build -t trustfl-client    -f apps/client/Dockerfile .
          docker build -t trustfl-dashboard apps/dashboard

      - name: Smoke-test Python imports inside client image
        # This specifically guards against PYTHONPATH regressions that would
        # break client-init (python -m trustfl_crypto.provision) at runtime.
        run: |
          docker run --rm trustfl-client python -m trustfl_crypto.provision --help
          docker run --rm trustfl-client python -c "
          from trustfl_crypto.keys import ClientIdentity
          from trustfl_ml.dataset import resolve_and_validate_dataset
          print('client imports OK')
          "
          docker run --rm trustfl-coordinator python -c "
          from trustfl_crypto.keys import ClientIdentity
          print('coordinator imports OK')
          "

      - name: Validate Compose configuration
        run: |
          docker compose config --quiet
          TRUSTFL_VERSION=ci \
          POSTGRES_PASSWORD=ci-db-password \
          API_READ_KEY=ci-read \
          API_WRITE_KEY=ci-write \
          API_ADMIN_KEY=ci-admin \
          DASHBOARD_ACCESS_KEY=ci-dashboard \
          COORDINATOR_ENROLLMENT_TOKEN=ci-coordinator \
          CORS_ALLOWED_ORIGINS=https://dashboard.example.test \
          BLOCKCHAIN_RPC_URL=https://rpc.example.test \
          BLOCKCHAIN_CONTRACTS_DIR=/tmp/trustfl-contracts \
          COORDINATOR_PRIVATE_KEY=0x1111111111111111111111111111111111111111111111111111111111111111 \
          FL_DATASET_DIR=/tmp/trustfl-dataset \
          docker compose -f docker-compose.published.yml config --quiet

  # ── Publish: build and push all four images to GHCR ─────────────────────
  publish:
    needs: [docker-verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - service: api
            context: .
            dockerfile: apps/api/Dockerfile
          - service: coordinator
            context: .
            dockerfile: apps/coordinator/Dockerfile
          - service: client
            context: .
            dockerfile: apps/client/Dockerfile
          - service: dashboard
            context: apps/dashboard
            dockerfile: apps/dashboard/Dockerfile

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef
        with:
          registry: ghcr.io
          # github.repository_owner is the org/user that owns the repo.
          # Using this (not github.actor) ensures the image is scoped to the
          # repository owner even when triggered by a collaborator.
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@318604b99e75e41977312d83839a89be02ca4893
        with:
          # Image name uses github.repository_owner (lowercase) to match the
          # GHCR namespace.  The ${{ lower(…) }} expression ensures no case
          # mismatch between the tag push and the package namespace.
          images: ghcr.io/${{ github.repository_owner }}/trustfl/${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build and push
        id: build
        uses: docker/build-push-action@a254f8ca60a858f3136a2f1f23a60969f2c402dd
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532
      - name: Sign and verify image digest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/trustfl/${{ matrix.service }}@${{ steps.build.outputs.digest }}
          REPOSITORY: ${{ github.repository }}
        run: |
          cosign sign --yes "$IMAGE"
          cosign verify "$IMAGE" \
            --certificate-identity-regexp "https://github.com/${REPOSITORY}/.github/workflows/.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/trustfl/${{ matrix.service }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
