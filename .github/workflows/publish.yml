# Publish TrustFL Docker images to GHCR on versioned tags and main branch.
#
# Triggered by:
#   - Push of a tag matching v* (e.g. v0.1.0)   → tags: latest + vX.Y.Z
#   - Push to main branch                         → tag: edge
#
# Required repository secret: GITHUB_TOKEN (automatic, read-only by default).
# Grant write package permissions under Settings → Actions → Workflow permissions.

name: Publish Docker Images

on:
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    # Only publish after all tests pass
    needs: []
    strategy:
      matrix:
        include:
          - service: api
            context: .
            dockerfile: apps/api/Dockerfile
          - service: coordinator
            context: .
            dockerfile: apps/coordinator/Dockerfile
          - service: client
            context: .
            dockerfile: apps/client/Dockerfile
          - service: dashboard
            context: apps/dashboard
            dockerfile: apps/dashboard/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/sayam-1705/trustfl/${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=main
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
