# Publish TrustFL Docker images to GHCR.
#
# Trigger: push of a tag matching v* (e.g. v0.1.0).
# Branch pushes do NOT publish images.  This avoids ambiguity between a moving
# "edge" tag and immutable release tags, and prevents publishing unverified
# commits.
#
# Release gate: the workflow runs the same Python test, lint, and Docker build
# checks as ci.yml before pushing any image.  Cross-workflow "needs" across
# separate workflow files is unreliable (only works for the same workflow file),
# so the gate is implemented as explicit required jobs in this file.
#
# Image namespace: ghcr.io/sayam-1705/trustfl/<service>
#   Packages are created automatically on first push if the GITHUB_TOKEN has
#   packages:write permission and the repository owner has granted it.
#
# ── Required one-time manual GitHub settings ─────────────────────────────────
# 1. Repository → Settings → Actions → General → Workflow permissions
#    → select "Read and write permissions"  (enables packages:write for GITHUB_TOKEN)
# 2. After the first successful publish, go to each package's settings page
#    (ghcr.io → your packages) and set visibility to Public if desired.
# ─────────────────────────────────────────────────────────────────────────────

name: Publish Docker Images

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  # ── Release gate: Python tests and lint ──────────────────────────────────
  python-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest tests/

  # ── Release gate: Docker builds + import smoke tests ─────────────────────
  docker-verify:
    needs: [python-tests]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build all images
        run: |
          docker build -t trustfl-api       -f apps/api/Dockerfile .
          docker build -t trustfl-coordinator -f apps/coordinator/Dockerfile .
          docker build -t trustfl-client    -f apps/client/Dockerfile .
          docker build -t trustfl-dashboard apps/dashboard

      - name: Smoke-test Python imports inside client image
        # This specifically guards against PYTHONPATH regressions that would
        # break client-init (python -m trustfl_crypto.provision) at runtime.
        run: |
          docker run --rm trustfl-client python -m trustfl_crypto.provision --help
          docker run --rm trustfl-client python -c "
          from trustfl_crypto.keys import ClientIdentity
          from trustfl_ml.dataset import resolve_and_validate_dataset
          print('client imports OK')
          "
          docker run --rm trustfl-coordinator python -c "
          from trustfl_crypto.keys import ClientIdentity
          print('coordinator imports OK')
          "

      - name: Validate Compose configuration
        run: docker compose config --quiet

  # ── Publish: build and push all four images to GHCR ─────────────────────
  publish:
    needs: [docker-verify]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        include:
          - service: api
            context: .
            dockerfile: apps/api/Dockerfile
          - service: coordinator
            context: .
            dockerfile: apps/coordinator/Dockerfile
          - service: client
            context: .
            dockerfile: apps/client/Dockerfile
          - service: dashboard
            context: apps/dashboard
            dockerfile: apps/dashboard/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # github.repository_owner is the org/user that owns the repo.
          # Using this (not github.actor) ensures the image is scoped to the
          # repository owner even when triggered by a collaborator.
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Image name uses github.repository_owner (lowercase) to match the
          # GHCR namespace.  The ${{ lower(…) }} expression ensures no case
          # mismatch between the tag push and the package namespace.
          images: ghcr.io/${{ github.repository_owner }}/trustfl/${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
