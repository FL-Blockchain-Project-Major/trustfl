name: Performance & Load Benchmarks

on:
  workflow_dispatch:
    inputs:
      assert_budgets:
        description: "Assert against performance budgets"
        type: boolean
        default: true
  schedule:
    - cron: "0 2 * * 1" # Run weekly on Monday at 02:00 UTC

permissions:
  contents: read

jobs:
  benchmarks:
    name: Run Benchmarks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.13"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install --no-deps -e .
          cd packages/zkp && npm ci

      - name: Execute benchmarks
        env:
          ZKP_VERIFY_COMMAND: "node packages/zkp/src/verify-cli.js"
        run: |
          python scripts/run_benchmarks.py --assert-budgets

      - name: Upload benchmark results artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: benchmark-results
          path: dist/benchmarks/benchmark_results.json
          if-no-files-found: error
