name: Performance & Load Benchmarks

on:
  workflow_dispatch:
    inputs:
      assert_budgets:
        description: "Assert against performance budgets"
        type: boolean
        default: true
  schedule:
    - cron: "0 2 * * 1" # Run weekly on Monday at 02:00 UTC

permissions:
  contents: read

jobs:
  benchmarks:
    name: Run Benchmarks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.13"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install --no-deps -e .
          cd packages/zkp && npm ci

      - name: Execute benchmarks
        env:
          ZKP_VERIFY_COMMAND: "node packages/zkp/src/verify-cli.js"
        run: |
          python scripts/run_benchmarks.py --assert-budgets

      - name: Upload benchmark results artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: benchmark-results
          path: dist/benchmarks/benchmark_results.json
          if-no-files-found: error
