# Gitleaks configuration for TrustFL
# https://github.com/gitleaks/gitleaks

title = "TrustFL gitleaks config"

[extend]
# Use gitleaks default ruleset as the base
useDefault = true

[allowlist]
description = "Hardhat development private key (Account #0) — publicly documented test fixture key, never used outside local/CI Hardhat nodes"
regexTarget = "secret"
regexes = [
    '''0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80''',
]
paths = [
    '''tests/test_phase10_production\.py''',
    '''tests/api/test_published_compose\.py''',
    '''tests/integration/distributed/test_phase13_production_acceptance\.py''',
    '''tests/integration/blockchain_fl/test_fl_blockchain\.py''',
    '''tests/integration/ha_dr/test_phase14_ha_dr\.py''',
]
