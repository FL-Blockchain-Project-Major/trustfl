groups:
  - name: trustfl-production
    rules:
      - alert: TrustFLApiErrorRateHigh
        expr: sum(rate(trustfl_api_errors_total[5m])) / sum(rate(trustfl_api_requests_total[5m])) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: API error rate is above 5%
          runbook: docs/runbooks/api-errors.md
      - alert: TrustFLApiLatencyHigh
        expr: max(trustfl_api_request_duration_seconds{quantile="0.99"}) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: API p99 latency exceeds two seconds
          runbook: docs/runbooks/api-latency.md
      - alert: TrustFLReadinessDegraded
        expr: trustfl_readiness == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: TrustFL API readiness checks are degraded
          runbook: docs/runbooks/dependencies.md
      - alert: TrustFLRateLimitSpikes
        expr: sum(rate(trustfl_api_errors_total{status="429"}[10m])) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Rate-limit violations are elevated
          runbook: docs/runbooks/security-events.md
      - alert: TrustFLRedisFallbackActive
        expr: increase(trustfl_redis_fallback_total[5m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: API rate limiter fell back to local memory due to Redis unavailability
          runbook: docs/runbooks/dependencies.md
      - alert: TrustFLDatabaseLatencyHigh
        expr: max(trustfl_db_query_seconds{quantile="0.99"}) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Database p99 query latency exceeds one second
          runbook: docs/runbooks/dependencies.md
      - alert: TrustFLSecretExpiringSoon
        expr: trustfl_secret_expiry_seconds > 0 and trustfl_secret_expiry_seconds < 604800
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: TLS/API/client secret expires within 7 days
          runbook: docs/runbooks/security-events.md
      - alert: TrustFLBackupStale
        expr: trustfl_backup_age_seconds > 86400
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: Latest verified PostgreSQL backup is older than 24 hours
          runbook: docs/production/backup-and-restore.md
